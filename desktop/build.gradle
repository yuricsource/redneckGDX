plugins {
    id 'application'
    id 'com.gradleup.shadow' version '8.3.5'
}

sourceSets {
    main {
        java {
            srcDirs = ['src']
        }
    }
}

application {
    mainClass = 'ru.m210projects.Redneck.desktop.DesktopLauncher'
}

dependencies {
    implementation project(':core')
    implementation project(':buildgdx-lwjgl3')
}

run {
    // DesktopLauncher expects arg[0] to be the directory containing redneck.grp.
    // Override with: ./gradlew :desktop:run --args="/absolute/path/to/grpdir"
    args = [file('.').absolutePath]
    standardInput = System.in
}

// Fat jar for the streaming container. `./gradlew :desktop:shadowJar` produces
// desktop/build/libs/desktop-<version>-all.jar containing all runtime deps
// (game classes, BuildGDX, LWJGL3, JInput, gdx-controllers) plus platform
// natives. The container's entrypoint runs this jar under Xvfb.
shadowJar {
    archiveClassifier = 'all'
    // Native shared libs collide harmlessly between the main jar and platform
    // jars (gdx-platform-natives-desktop, jinput-platform-natives-all). Merge
    // service files and let the last-one-wins for other resources.
    mergeServiceFiles()
    // Some libs ship signed jars; drop the signatures so the merged jar loads.
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    exclude 'module-info.class'

    manifest {
        attributes 'Main-Class': application.mainClass.get()
    }
}
