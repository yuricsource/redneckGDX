worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 512; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;
    sendfile      on;

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering    off;

    client_max_body_size 1g;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream kasm_backend {
        server 127.0.0.1:6901;
        keepalive 4;
    }

    server {
        listen 8080 default_server;
        server_name _;

        location = / {
            root /opt/rrgdx/landing;
            try_files /index.html =404;
        }

        location = /healthz {
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location = /grp-status {
            add_header Content-Type application/json;
            if (-f /data/redneck.grp) { return 200 '{"present":true}'; }
            return 200 '{"present":false}';
        }

        location = /logs {
            proxy_pass         http://127.0.0.1:8081/logs;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
        }

        location = /upload {
            client_max_body_size 1g;
            proxy_pass         http://127.0.0.1:8081/upload;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_request_buffering off;
        }

        # KasmVNC: HTML5 client on /kasm/ (proxy strips prefix so KasmVNC
        # sees requests at /). WebSocket upgrade for the RFB/audio channel
        # shares this same location.
        location /kasm/ {
            proxy_pass         http://kasm_backend/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host $host;
            proxy_set_header   X-Forwarded-For $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
