worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 512; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;
    sendfile      on;

    # Long timeouts for the WebSocket / noVNC connection; the browser keeps it
    # open for the entire play session.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # Grp files vary a lot (RR ~40 MiB, RRRA ~74 MiB, custom mods
    # arbitrary). Set an intentionally generous ceiling here so no legit
    # grp is refused; the container is a single-user demo, no abuse risk.
    client_max_body_size 1g;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8080 default_server;
        server_name _;

        # Landing page — upload form or, if the grp is already present, we
        # send the browser straight to noVNC.
        location = / {
            root /opt/rrgdx/landing;
            try_files /index.html =404;
        }

        location = /healthz {
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # Whether a grp is already stored — the landing page hits this to
        # decide between showing the upload form and auto-redirecting.
        location = /grp-status {
            add_header Content-Type application/json;
            if (-f /data/redneck.grp) { return 200 '{"present":true}'; }
            return 200 '{"present":false}';
        }

        # Upload endpoint. Passed to the Python server.
        location = /upload {
            client_max_body_size 1g;   # belt-and-suspenders vs the http-level
            proxy_pass         http://127.0.0.1:8081/upload;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_request_buffering off;
        }

        # noVNC static assets. The Debian novnc package ships at
        # /usr/share/novnc; the container-start.sh symlinks vnc.html to
        # index.html so /vnc/ works as a directory too.
        location /vnc.html {
            root /usr/share/novnc;
        }
        location /vendor/ {
            root /usr/share/novnc;
        }
        location /app/ {
            root /usr/share/novnc;
        }
        location /core/ {
            root /usr/share/novnc;
        }
        location /utils/ {
            root /usr/share/novnc;
        }

        # WebSocket upgrade path for websockify -> tigervnc.
        location /websockify {
            proxy_pass         http://127.0.0.1:6080/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host $host;
        }
    }
}
