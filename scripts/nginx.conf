worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 512; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;
    sendfile      on;

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering    off;

    # Grp files vary a lot (RR ~40 MiB, RRRA ~74 MiB, custom mods
    # arbitrary). Set an intentionally generous ceiling so no legit grp
    # is refused; single-user demo, no abuse risk.
    client_max_body_size 1g;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Rewrite Xpra's absolute-path references (a handful of URLs in its
    # HTML5 client point at /js/, /css/, etc) so they resolve under our
    # /xpra/ prefix. Same treatment for the WebSocket path.
    upstream xpra_backend {
        server 127.0.0.1:14500;
        keepalive 4;
    }

    server {
        listen 8080 default_server;
        server_name _;

        # Landing page — upload form; auto-redirects to /xpra/ if grp
        # already stored.
        location = / {
            root /opt/rrgdx/landing;
            try_files /index.html =404;
        }

        location = /healthz {
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # Debug: dump the interesting container logs + process list so
        # symptoms can be shared without shell access. Nginx alias +
        # try_files won't concat, so use a subrequest via lua? No lua.
        # Simpler: proxy to a tiny Python endpoint (upload_server also
        # handles this).
        location = /logs {
            proxy_pass         http://127.0.0.1:8081/logs;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
        }

        location = /grp-status {
            add_header Content-Type application/json;
            if (-f /data/redneck.grp) { return 200 '{"present":true}'; }
            return 200 '{"present":false}';
        }

        location = /upload {
            client_max_body_size 1g;
            proxy_pass         http://127.0.0.1:8081/upload;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_request_buffering off;
        }

        # Xpra HTML5 client + WebSocket. Everything under /xpra/ proxies
        # to Xpra's TCP listener; the trailing slash on proxy_pass strips
        # the /xpra prefix so Xpra sees "/" as its own root.
        location /xpra/ {
            proxy_pass         http://xpra_backend/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host $host;
            proxy_set_header   X-Forwarded-For $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
            # Xpra's HTML5 client keeps the WebSocket open for the whole
            # session; the http-level 3600s timeouts already cover that.
        }
    }
}
