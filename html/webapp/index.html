<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RedneckGDX</title>
    <style>
        html, body {
            margin: 0; padding: 0; height: 100%;
            background: #111; color: #ddd;
            font-family: system-ui, sans-serif;
        }
        body {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 1em;
        }
        h1 { color: #d9793a; margin-bottom: 0.25em; }
        p { max-width: 40em; line-height: 1.5; text-align: center; }
        code { background: #222; padding: 0.1em 0.35em; border-radius: 3px; }
        small { color: #888; }
        a { color: #d9793a; }

        #drop {
            margin-top: 1.5em;
            padding: 3em 2em;
            width: min(28em, 90vw);
            border: 2px dashed #444;
            border-radius: 8px;
            background: #1a1a1a;
            text-align: center;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }
        #drop.dragover { border-color: #d9793a; background: #22150a; }
        #drop input { display: none; }
        #drop .btn {
            display: inline-block;
            background: #d9793a; color: #111;
            padding: 0.6em 1.2em; border-radius: 4px;
            font-weight: 600; margin-top: 0.8em;
        }

        #progress {
            display: none;
            width: min(28em, 90vw);
            margin-top: 1.5em;
        }
        #progress.active { display: block; }
        #progress .bar {
            height: 10px; background: #222; border-radius: 5px; overflow: hidden;
        }
        #progress .fill {
            height: 100%; width: 0%; background: #d9793a;
            transition: width 0.15s;
        }
        #progress .label { margin-top: 0.4em; font-size: 0.9em; color: #aaa; }

        #error { color: #ff8080; margin-top: 1em; text-align: center; }
    </style>
</head>
<body>
    <h1>RedneckGDX</h1>
    <p>
        Browser-streamed port of the libGDX Redneck Rampage source port.
        The game runs inside this container; you play it in your browser
        over a VNC WebSocket. You must supply your own
        <code>redneck.grp</code> (from a legal copy of the game).
    </p>

    <label id="drop">
        <div><strong>Drop your <code>redneck.grp</code> here</strong></div>
        <div><small>or click to choose a file</small></div>
        <div class="btn">Choose file</div>
        <input type="file" id="grp-file" accept=".grp,application/octet-stream">
    </label>

    <div id="progress">
        <div class="bar"><div class="fill" id="fill"></div></div>
        <div class="label" id="label">Uploading…</div>
    </div>

    <div id="error"></div>

    <script>
        const els = {
            drop:     document.getElementById('drop'),
            file:     document.getElementById('grp-file'),
            progress: document.getElementById('progress'),
            fill:     document.getElementById('fill'),
            label:    document.getElementById('label'),
            error:    document.getElementById('error'),
        };

        // If a grp is already present in the container, skip the form and go
        // straight to noVNC. `nginx.conf` serves /grp-status as static JSON.
        fetch('/grp-status').then(r => r.json()).then(s => {
            if (s.present) location.replace('/xpra/connect.html?autoconnect=true&sound=on&audio_codec=opus&clipboard=true&keyboard_layout=us&scaling=auto');
        }).catch(() => { /* fall through to upload UI */ });

        function upload(file) {
            const fd = new FormData();
            fd.append('grp', file, file.name);

            els.drop.style.display = 'none';
            els.progress.classList.add('active');
            els.error.textContent = '';

            const xhr = new XMLHttpRequest();
            xhr.open('POST', '/upload');
            xhr.upload.onprogress = (e) => {
                if (!e.lengthComputable) return;
                const pct = Math.round(e.loaded / e.total * 100);
                els.fill.style.width = pct + '%';
                els.label.textContent = `Uploading… ${pct}% (${Math.round(e.loaded / 1024 / 1024)} MiB)`;
            };
            xhr.onload = () => {
                if (xhr.status === 200 || xhr.status === 303 || xhr.status === 204) {
                    els.label.textContent = 'Upload complete. Connecting…';
                    els.fill.style.width = '100%';
                    setTimeout(() => location.replace('/xpra/connect.html?autoconnect=true&sound=on&audio_codec=opus&clipboard=true&keyboard_layout=us&scaling=auto'), 400);
                } else {
                    els.error.textContent = `Upload failed (${xhr.status}): ${xhr.responseText || 'no detail'}`;
                    els.progress.classList.remove('active');
                    els.drop.style.display = '';
                }
            };
            xhr.onerror = () => {
                els.error.textContent = 'Upload failed: network error.';
                els.progress.classList.remove('active');
                els.drop.style.display = '';
            };
            xhr.send(fd);
        }

        els.file.addEventListener('change', () => {
            if (els.file.files[0]) upload(els.file.files[0]);
        });

        // Drag-and-drop support.
        ['dragenter', 'dragover'].forEach(ev =>
            els.drop.addEventListener(ev, (e) => { e.preventDefault(); els.drop.classList.add('dragover'); }));
        ['dragleave', 'drop'].forEach(ev =>
            els.drop.addEventListener(ev, (e) => { e.preventDefault(); els.drop.classList.remove('dragover'); }));
        els.drop.addEventListener('drop', (e) => {
            const f = e.dataTransfer.files[0];
            if (f) upload(f);
        });
    </script>
</body>
</html>
