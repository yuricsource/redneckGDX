<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RedneckGDX</title>
    <style>
        html, body {
            margin: 0; padding: 0; height: 100%; width: 100%;
            background: #000; color: #ddd;
            font-family: system-ui, sans-serif;
            overflow: hidden;
        }
        iframe#kasm {
            border: 0; width: 100vw; height: 100vh; display: block;
        }
        #unmute-overlay {
            position: fixed; inset: 0;
            display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.75);
            z-index: 10;
            cursor: pointer;
            font-size: 1.2em;
            text-align: center;
        }
        #unmute-overlay.hidden { display: none; }
        #unmute-overlay .box {
            padding: 1.5em 2em;
            background: #d9793a;
            color: #111;
            border-radius: 6px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <iframe id="kasm" src="/kasm/index.html?path=kasm/websockify&resize=remote&reconnect=1&autoconnect=1"></iframe>

    <div id="unmute-overlay">
        <div class="box">Click to enter &amp; enable sound</div>
    </div>

    <audio id="audio" src="/audio.ogg" preload="none"></audio>

    <script>
        const audio = document.getElementById('audio');
        const overlay = document.getElementById('unmute-overlay');
        const iframe = document.getElementById('kasm');

        // Browser autoplay policy requires a user gesture before the
        // <audio> element can start. The overlay's click handler both
        // satisfies that requirement and forwards focus into the iframe
        // so keyboard/mouse go to the game.
        overlay.addEventListener('click', async () => {
            try {
                await audio.play();
            } catch (err) {
                console.warn('audio.play() failed:', err);
            }
            overlay.classList.add('hidden');
            iframe.focus();
        });
    </script>
</body>
</html>
