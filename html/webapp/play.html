<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RedneckGDX</title>
    <style>
        html, body {
            margin: 0; padding: 0; height: 100%; width: 100%;
            background: #000; color: #ddd;
            font-family: system-ui, sans-serif;
            overflow: hidden;
        }
        iframe#kasm {
            border: 0; width: 100vw; height: 100vh; display: block;
        }
        #unmute-overlay {
            position: fixed; inset: 0;
            display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.75);
            z-index: 10;
            cursor: pointer;
            font-size: 1.2em;
            text-align: center;
        }
        #unmute-overlay.hidden { display: none; }
        #unmute-overlay .box {
            padding: 1.5em 2em;
            background: #d9793a;
            color: #111;
            border-radius: 6px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <iframe id="kasm" src="/kasm/index.html?path=kasm/websockify&resize=remote&reconnect=1&autoconnect=1"></iframe>

    <div id="unmute-overlay">
        <div class="box">Click to enter &amp; enable sound</div>
    </div>

    <audio id="audio" src="/audio.ogg" preload="none"></audio>

    <script>
        const audio = document.getElementById('audio');
        const overlay = document.getElementById('unmute-overlay');
        const iframe = document.getElementById('kasm');

        // Fire on the first user gesture (any of click / keydown / touch).
        // Overlay disappears immediately; audio starts asynchronously.
        // Previously we did `await audio.play()` before hiding — but with
        // preload="none" and a live stream, the play Promise can sit
        // pending until enough data has been buffered, which meant the
        // overlay never disappeared. Fire-and-forget instead.
        let entered = false;
        function enter(reason) {
            if (entered) return;
            entered = true;
            console.log('[play] entering via', reason);
            overlay.classList.add('hidden');
            iframe.focus();
            audio.play().then(
                () => console.log('[play] audio.play() OK'),
                (err) => console.warn('[play] audio.play() failed:', err),
            );
        }

        overlay.addEventListener('pointerdown', () => enter('pointerdown'));
        overlay.addEventListener('click',       () => enter('click'));
        window.addEventListener('keydown',      () => enter('keydown'));
        window.addEventListener('touchstart',   () => enter('touchstart'), { passive: true });

        // Keep the audio element near the live edge — HTMLAudioElement
        // buffers ahead of the playhead, which stacks with server-side
        // and network buffering. Poll aggressively and jump forward if
        // we've fallen more than 200 ms behind the buffered end.
        setInterval(() => {
            if (!entered) return;
            if (audio.readyState < 2) return;
            const b = audio.buffered;
            if (b.length === 0) return;
            const end = b.end(b.length - 1);
            const behind = end - audio.currentTime;
            if (behind > 0.2) {
                audio.currentTime = Math.max(end - 0.05, 0);
            }
        }, 250);
    </script>
</body>
</html>
