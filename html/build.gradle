// :html — browser build.
//
// The gdx-teavm plugin (vendored at external/gdx-teavm and wired via
// pluginManagement { includeBuild(...) } in root settings.gradle) is
// active: `./gradlew :html:generateJavaScript` compiles the game to JS.
//
// However, TeaVM 0.15.0's classlib is missing several java.* classes/
// methods that BuildGDX reaches into (StringJoiner, NetworkInterface,
// DatagramSocket, System.exit, ClassLoader.getResource, Runtime.maxMemory,
// FileInputStream.getChannel). TeaVM treats these as SEVERE and refuses
// to emit output. Each needs a per-site patch or stub in BuildGDX.
//
// So we ship two tasks:
//   :html:dist        — placeholder bundle (grp picker + landing page).
//                       Used by the Dockerfile / CI; stays green.
//   :html:assembleWeb — real TeaVM compile + overlay. Locally-invokable;
//                       currently fails until BuildGDX compat is patched.

plugins {
    id 'com.github.xpenatan.gdx-teavm'
}

// The gdx-teavm plugin's runtime jars are Java 17+; :html itself compiles
// against them, so override the root Java 8 default just for this module.
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

sourceSets {
    main {
        java {
            srcDirs = ['src']
        }
    }
}

dependencies {
    implementation project(':core')
}

gdxTeaVM {
    // rrgdx.dat (BuildGDX's patch data) is baked in. The user-supplied
    // redneck.grp is NOT bundled — the browser overlay prompts for upload
    // on first load; the file is persisted in IndexedDB.
    assets.from(file('../core/res'))

    js {
        mainClass.set('ru.m210projects.Redneck.html.HtmlLauncher')
    }
}

// -------- Placeholder pipeline (green today, used by Docker/CI) --------
task dist(type: Copy) {
    group = 'gdx teavm'
    description = 'Assembles the placeholder browser bundle (grp picker + landing page).'
    from 'webapp'
    from('../core/res') { into 'assets' }
    into layout.buildDirectory.dir('dist')
}
build.dependsOn dist

// -------- Real TeaVM pipeline (locally iterable) --------
task assembleWeb(type: Copy, dependsOn: 'generateJavaScript') {
    group = 'gdx teavm'
    description = 'Runs the TeaVM compile, overlays the grp picker, produces build/dist-web/.'
    from 'build/dist/js/webapp'
    from 'webapp/index.html'
    exclude 'WEB-INF/**'
    into layout.buildDirectory.dir('dist-web')
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}
